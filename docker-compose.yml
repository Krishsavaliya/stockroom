services:
  db:
    image: postgres:17-alpine
    container_name: stockroom-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom_dev_password
      POSTGRES_DB: stockroom

    ports:
      - "5432:5432"

    volumes:
      - stockroom_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stockroom_pgdata:
